<!DOCTYPE html>
<html lang="en">
<head>
	<title>scroller</title>
	<!--Bootstrap-->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
	<!--Leaflet-->
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script> 
	
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="The 1968 Project is an interactive map of the key events of this tumultuous year">
	<meta charset="UTF-8">

<style>
	.noRefresh {
		overflow-y:auto;
		overscroll-behavior-y: contain;
		}

</style>
</head>
<body>

<h2 class="m-4">Scrolly</h1>
<div class="p-2 m-3 border noRefresh" id="monthScrl" onWheel="scrolly(event);"> <!-- onTouchMove https://stackoverflow.com/questions/48941711/getting-onwheel-event-to-work-on-mobile -->
	<h1>Dec</h1>
	<h1 class="bg-info">All</h1>
	<h1>Jan</h1>
</div>

<script>

const mnthSel = document.querySelector("#mnth");

var mnthNum = 0;
var mnthArray = ['All', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'June', 'July', 'Aug', 'Sept', 'Oct', 'Nov', 'Dec'];



function scrolly(event) {
	if (event.deltaY > 0) {
		mnthNum += 1
	} else {
		mnthNum -= 1};
		chMnth(event);
}

function chMnth(event) {
	mnthA = mnthArray[mnthNum - 1];
	mnthB = mnthArray[mnthNum];
	mnthC = mnthArray[mnthNum + 1];	
	
	
	if (mnthNum > 12  || mnthNum == 0)  {
		mnthNum = 0
		mnthA = 'Dec';
		mnthB = 'All';
		mnthC = 'Jan';
	} else {
		if (mnthNum == 12 || mnthNum < 0) {
			mnthNum = 12
			mnthA = 'Nov';
			mnthB = 'Dec';
			mnthC = 'All';
		} else {
		if (mnthNum == 1) {
			mnthA = 'All';
			mnthB = 'Jan';
			mnthC = 'Feb';
			};
		};
	};	
	
	document.getElementById("monthScrl").innerHTML = '<h1>' + mnthA + '</h1><h1 class="bg-info">' + mnthB + '</h1><h1>' + mnthC + '</h1>';
	// Create DOM with onclicks for up down
}

monthScrl.addEventListener("touchstart", startTouch, false);
monthScrl.addEventListener("touchmove", moveTouch, false);
 
// Swipe Up / Down / Left / Right
var initialY = null;
 
function startTouch(e) {

  initialY = e.touches[0].clientY;
};
 
function moveTouch(e) {
  
 
	if (initialY === null) {
		return;
	}
 
  
	var currentY = e.touches[0].clientY;
	var diffY = initialY - currentY;
 
	if (diffY > 0) {
		mnthNum += 1;
		chMnth(e);
    } else {
		mnthNum -= 1;
		chMnth(e);
    }  
  
 
  
  initialY = null;
   
  e.preventDefault();
};







</script>
</body>
</html>
