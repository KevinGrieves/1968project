<script>
let currentMonth = document.querySelector(".crntmonth");
let days = document.querySelector(".days");
let previous = document.querySelector(".left");
let next = document.querySelector(".right");
let selected = document.querySelector(".selected");

let date = new Date("January 01, 1968");

let year = 1968;
let month = 0;

function displayCalendar() {
	const firstDay = new Date(year, month, 1);
	const lastDay = new Date(year, month + 1, 0);
	const firstDayIndex = firstDay.getDay(); //4
	const numberOfDays = lastDay.getDate(); //31

	let formattedDate = date.toLocaleString("en-US", {
		month: "long"
	});

	currentMonth.innerHTML = `${formattedDate}`;

	for (let x = 1; x <= firstDayIndex; x++) {
		const div = document.createElement("div");
		
		div.innerHTML += "";
		days.appendChild(div);
	}

	for (let i = 1; i <= numberOfDays; i++) {
		let div = document.createElement("div");
		let currentDate = new Date(year, month, i);
	
		div.dataset.date = currentDate.toDateString();
		dateId = currentDate.toISOString().split('T')[00];
		
		console.log(dateId);
		
		div.id = dateId.substring(5, 12);
		div.innerHTML += i;

		
		
		days.appendChild(div);

	}
}

// Call the function to display the calendar
displayCalendar();

previous.addEventListener("click", () => {
	days.innerHTML = "";
	

	if (month == 0) {
		month = 11;
	} else {
	month = month - 1;
	}
	date.setMonth(month);
	displayCalendar();
	displaySelected();
	//refreshMap();
	filterMapByMonth();
});

next.addEventListener("click", () => {
	days.innerHTML = "";
	

	if (month == 11) {
		month = 0;
	} else {
		month += 1;
	};
	date.setMonth(month);
	date.setYear(1968);
	displayCalendar();
	displaySelected();
	// refreshMap();
	filterMapByMonth();
});

calendar.addEventListener("touchstart", strtMnthTch, false);
calendar.addEventListener("touchmove", mnthTch, false);

 

var initMX = null;
 
function strtMnthTch(e) {

  initMX = e.touches[0].clientX;
}
 
function mnthTch(e) {
  
 
	if (initMX === null) {
		return;
	}
 
  
	var currMX = e.touches[0].clientX;
	var diffX = initMX - currMX;
 
	if (diffX > 0) {
		if (month == 11) {
			month = 0;
		} else {
			month += 1;
		};
		
	} else {
		if (month == 0) {
			month = 11;
		} else {
			month -= 1;
		};
	
		
	};
	date.setMonth(month);
	date.setYear(1968);
	days.innerHTML = "";
	displayCalendar();
	displaySelected();
	//refreshMap();
	filterMapByMonth();
	initMX = null;
   
//  e.preventDefault();
}




function displaySelected() {
  const dayElements = document.querySelectorAll(".days div");
  dayElements.forEach((day) => {
    day.addEventListener("click", (e) => {
		

		let selDate = e.target.id.split("-");
//		changeDate(selDate[0], selDate[1]);


		eventId = selDate[0] + "/" + selDate[1];
		document.getElementById(eventId).scrollIntoView({
		behavior: 'smooth'
		}); 
		
		$(document.getElementById(eventId)).animate({ color: "lightblue"},'quick');
		$(document.getElementById(eventId)).animate({ color: "black"},'quick');

			
		
		
	});
  });

		
   
}
displaySelected();

</script>
