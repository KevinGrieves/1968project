	<!-- Responsive sidebar -->

				<span class="navbar-toggler-icon"></span>
				
            </button>
            
        </nav>
        <div class="container-fluid d-flex m-0 p-0">

                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#leftnav" aria-controls="leftnav" aria-label="Close"></button>
                </div>
                <div class="flex-column h-100">
					<div class="bg-white rounded p-2 m-3 overflow-auto" style="--bs-bg-opacity: .8; width:200px;">
						<img src="./images/1968logo.png" width="300" class="img-fluid">  
					</div>
					<div class="bg-white rounded p-2 m-3" style="--bs-bg-opacity: .8;">
						<div class="row justify-content-left p-2">
							<div class="d-grid col-sm-6 mx-auto p-0 border border-primary ms-0 w-50" id="monthScrl" onWheel="scrllM(event);">
								<button class="btn btn-lg" onclick="mnthNum -= 1; chMnth(monthScrl);">Dec</button>
								<button class="btn btn-lg bg-info">All</button>
								<button class="btn btn-lg" onclick="mnthNum += 1; chMnth(monthScrl);">Jan</button>
							</div>
							<div class="d-none col-sm-5 mx-auto p-0 border border-primary w-50" id="dayScrl" onWheel="scrllD(event);" >
								<button class="btn btn-lg" onclick="dayNum -= 1; chDay(monthScrl);">31</button>
								<button class="btn btn-lg bg-info">All</button>
								<button class="btn btn-lg" onclick="dayNum += 1; chDay(monthScrl);">1</button>
							</div>
						</div>
						
						
				<!--		<div class="form-check">
							<label class="form-check-label" for="chkDate">Filter by date</label>
							<input type="checkbox" class="form-check-input" id="chkDate" name="dateFltr" onchange='dateChk(this);'>
							
						</div>
						
						<div id="datePicker" class="collapse">
						
							<ul class="nav nav-pills nav-justified" role="tablist">
								<li>
									<a class="nav-link active" data-bs-toggle="tab" href="#monthTab" onclick="clickMonth()">Month</a>

								<li class="nav-item">
									<a class="nav-link" data-bs-toggle="tab" href="#dayTab" onclick="clickDay()">Day</a>
								</li>
								
							</ul>
						
							<div class="tab-content mt-1">
								<div id="monthTab" class="container tab-pane active p-0">
									<input class="form-control" id="selMonth" type="month" value="0" min="1968-01" max="1968-12" onchange="changeMonth(value);">
								</div>
								<div id="dayTab" class="container tab-pane fade p-0">
									<input class="form-control" id="selDate" type="date" value="0" min="1968-01-01" max="1968-12-31" onchange="changeDay(value);">
								</div>
							</div>

						</div>   -->
						
						
						
						
						<div class="dropdown mt-2">
							<button id="topicBtn" class="btn btn-primary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
								Select Topic
							</button>
							<ul class="dropdown-menu">
								
								<li><a class="dropdown-item" href="#" onclick="changeKeyword('all');">All</a></li>
								<li><a class="dropdown-item" href="#" onclick="changeKeyword('Disaster');">Disaster</a></li>
								<li><a class="dropdown-item" href="#" onclick="changeKeyword('Nuclear weapons');">Nuclear weapons</a></li>
								<li><a class="dropdown-item" href="#" onclick="changeKeyword('Prague Spring');">Prague Spring</a></li>
								<li><a class="dropdown-item" href="#" onclick="changeKeyword('Technology');">Technology</a></li>
								<li><a class="dropdown-item" href="#" onclick="changeKeyword('Vietnam War');">Vietnam War</a></li>
								
							</ul>
						</div>
					</div>
					<div id="eventList" class="bg-white rounded p-2 m-3 overflow-auto" style="--bs-bg-opacity: .8; height: calc(100vh - 400px);">

</body>
<script src="test.json" type="text/javascript"></script>
<script src="CShapes-2.0.geojson" type="text/javascript"></script>


<script>
	const loadingScreen = document.querySelector('.loading-screen');
	window.addEventListener('load', () => {
			loadingScreen.style.opacity = '0';
			setTimeout(() => {
				
				loadingScreen.style.display = 'none';
			}, 200);
		
	});
	
	const mnthSel = document.querySelector("#mnth");

	var mnthNum = 0;
	var dayNum = 0;
	var mnthArray = ['All', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
	
	var filterKey = 'all';	
	var fltDay = 0;
	var fltMonth = 0;
	var prevDate = '';
	
	var map = L.map('map', {
		worldCopyJump: true,
		center:[40, -10],
		zoomSnap: 0.25,
		zoom: 2.5,
		maxZoom: 19,
		minZoom: 2,
		zoomControl: false
	});
	


	L.control.zoom({
		position: 'bottomright'
	}).addTo(map);

	L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
		noWrap: true
		
	}).addTo(map);
	
	function markerClick(e) {
  		
  		clickedMarker = e.target;
  		eventTitle = clickedMarker.feature.properties.title;
  		eventLoc = clickedMarker.feature.properties.location;
  		eventBlurb = clickedMarker.feature.properties.description;
  		eventDate = clickedMarker.feature.properties.datetxt;
  		eventKeys = clickedMarker.feature.properties.keywords;
  		eventImg = clickedMarker.feature.properties.image;
  		eventAlt = clickedMarker.feature.properties.alt;
  		
  		if (clickedMarker.feature.properties.attr == null) {
            eventAttr = ""
        } else {
            eventAttr = '<span style="font-size:50%;">' + clickedMarker.feature.properties.attr + '</span>'
        };
  		
  		let ibHead = document.getElementById('infoBoxHead');
  		ibHead.innerHTML='<h4>' + eventTitle + '</h4>';
  		let ibBody = document.getElementById('infoBoxBody');
  		ibBody.innerHTML='<h5>' + eventDate + '</h5><h5>Location: ' + eventLoc + '</h5><div style="width:200px; line-height:50%; float:right;  margin-left:8px;"><img src="./images/' + eventImg + '" class="img-fluid" alt="' + eventAlt + '" title="' + eventAlt + '" >' + eventAttr + '</div><p>' + eventBlurb + '</p>';

  		if (eventKeys.indexOf(', ') == -1) {
			createKeylink(eventKeys)
		} else {
			var spltKeys = eventKeys.split(', ');
			createKeylink(spltKeys[0]);
			const breakKeys = document.createElement('br');
			ibBody.appendChild(breakKeys);
			createKeylink(spltKeys[1]);
			
		};
  		
  	
  		
  		
  		
  		var coOrds = clickedMarker.getLatLng();
				map.flyTo([coOrds.lat, coOrds.lng], 5);
  		$("#infoBox").modal('show');
		
		
		

	}
	
	function cntryClick(e) {
  		
  		clickedCntry = e.target;
  		cntryName = clickedCntry.feature.properties.cntry_name;
  		
  		
  		let ibHead = document.getElementById('infoBoxHead');
  		ibHead.innerHTML='<h4>' + cntryName + '</h4>';
  		let ibBody = document.getElementById('infoBoxBody');
  		ibBody.innerHTML='Put something here';
  		$("#infoBox").modal('show');
		
		
		

	}
	
	function onEachFeature(feature, layer) {
		
		
		const eventLst = document.getElementById('eventList');
		
		const newDate = document.createElement('p');
		if (prevDate !== feature.properties.datetxt) {
			newDate.innerText = feature.properties.datetxt;
		};
		newDate.setAttribute("style", "font-size:70%; margin-bottom:0;");
		
		prevDate = feature.properties.datetxt;
		
		
		
		
		
		
		const newEvent = document.createElement('a');
		newEvent.href = "#";
		newEvent.innerText = feature.properties.title;
		newEvent.setAttribute("style", "display:block; padding-bottom:6px;");
		newEvent.setAttribute("data-bs-dismiss", "offcanvas");
		newEvent.setAttribute("data-bs-target", "#leftnav");
		
		newEvent.onclick = function () {
				eventTitle = feature.properties.title;
				eventLoc = feature.properties.location;
				eventBlurb = feature.properties.description;
				eventDate = feature.properties.datetxt;
				eventKeys = feature.properties.keywords;
				eventImg = feature.properties.image;
				eventAlt = feature.properties.alt;
				
				if (feature.properties.attr == null) {
					eventAttr = ""
				} else {
					eventAttr = '<span style="font-size:50%;">' + feature.properties.attr + '</span>'
				};
				let ibHead = document.getElementById('infoBoxHead');
				ibHead.innerHTML='<h4>' + eventTitle + '</h4>';
				let ibBody = document.getElementById('infoBoxBody');
				ibBody.innerHTML='<h5>' + eventDate + '</h5><h5>Location: ' + eventLoc + '</h5><div style="width:200px; line-height:50%; float:right; margin-left:8px;"><img src="./images/' + eventImg + '" class="img-fluid" alt="' + eventAlt + '" title="' + eventAlt + '" >' + eventAttr + '</div><p>' + eventBlurb + '</p>';
				
				
				//Multi Keyword
				if (eventKeys.indexOf(', ') == -1) {
					createKeylink(eventKeys)
				} else {
				var spltKeys = eventKeys.split(', ');
				createKeylink(spltKeys[0]);
				const breakKeys = document.createElement('br');
				ibBody.appendChild(breakKeys);
				createKeylink(spltKeys[1]);
			
				};
				
				
				
				var coOrds = layer.getLatLng();
				map.flyTo([coOrds.lat, coOrds.lng], 5);
				$("#infoBox").modal('show');
				
			};
		
		eventLst.appendChild(newDate);
		eventLst.appendChild(newEvent);
		

		

		layer.on({
			click: markerClick
		});
		
	}
	
	function createKeylink(addKey) {
		let ibBody = document.getElementById('infoBoxBody');
		const kwordLink = document.createElement('a');
		kwordLink.href = "#";
		kwordLink.innerText = addKey;
		kwordLink.setAttribute("style", "font-style:italic;");
		kwordLink.onclick = function () {
			topicBtn.innerHTML = addKey;
			filterKey = addKey;
			$("#infoBox").modal('hide');
			
			refreshMap();
		};
		ibBody.appendChild(kwordLink);
	}
	
	
	function onEachCountry(feature, layer) {
		layer.on({
			click: cntryClick
		});
		
	}

	var cntryLayer = new L.geoJSON(countries68, {
		onEachFeature: onEachCountry
	}).addTo(map);
	
	cntryLayer.setStyle({
		color: "#ff4000", 
		weight: 1, 
		opacity: 0.3
	});
	
	
	
	function applyFilter(feature) {
		
		
			if (fltDay > 0) {
				if (feature.properties.day != fltDay) {
					return false;
				}
			};
			if (fltMonth > 0) {
				if (feature.properties.month != fltMonth) {
					
					return false;
					
				}
			};
		
		
		if (filterKey !== 'all') {
			if (feature.properties.keywords.indexOf(filterKey) == -1) return false;
		};
		
		return true;
			
		

	}

	function refreshMap() {
		let newEventList = document.getElementById('eventList');
		newEventList.innerHTML='<p><b>Events</b></p>';
		
		
		markerLayer.clearLayers();
		markerLayer = L.geoJSON(testdb, {
			filter: applyFilter,
			onEachFeature: onEachFeature
		}).addTo(map);
		map.flyTo([40, -10], 2.5)
		prevDate = '';
	}
	
	
	var markerLayer = new L.geoJSON(testdb, {
		
		onEachFeature: onEachFeature
	}).addTo(map);
	prevDate = '';
	
	function changeDate(newMnth, newDay) {
		
		fltMonth = newMnth;
		fltDay = newDay;
		
		refreshMap();
	
	}
	
	
	
	

	function changeKeyword(keyword) {
		filterKey = keyword;
		if (keyword === 'all') {
			topicBtn.innerHTML = 'Select Topic';
		} else  topicBtn.innerHTML = keyword;
		refreshMap();
		
	}
	
	function scrllM(event) {
		if (event.deltaY > 0) {
			mnthNum += 1
		} else {
			mnthNum -= 1};
		chMnth(event);
	}

	function scrllD(event) {
		if (event.deltaY > 0) {
			dayNum += 1
		} else {
			dayNum -= 1};
		chDay(event);
	}

	function chMnth(event) {
		mnthA = mnthArray[mnthNum - 1];
		mnthB = mnthArray[mnthNum];
		mnthC = mnthArray[mnthNum + 1];	
		
		
		if (mnthNum > 12  || mnthNum == 0)  {
			mnthNum = 0;
			dayNum = 0;
			mnthA = 'Dec';
			mnthB = 'All';
			mnthC = 'Jan';
			
		} else {
			if (mnthNum == 12 || mnthNum < 0) {
				mnthNum = 12;
				mnthA = 'Nov';
				mnthB = 'Dec';
				mnthC = 'All';
			
			} else {
			if (mnthNum == 1) {
				mnthA = 'All';
				mnthB = 'Jan';
				mnthC = 'Feb';
			
				};
			};
		};	
		
		// document.getElementById("monthScrl").innerHTML = '<h1>' + mnthA + '</h1><h1 class="bg-info">' + mnthB + '</h1><h1>' + mnthC + '</h1>';
		// Create DOM with onclicks for up down
		document.getElementById("monthScrl").innerHTML = '';
		
		const monthDiv = document.getElementById('monthScrl');
		addMnth = document.createElement('button');
		addMnth.innerText = mnthA;
		addMnth.classList.add("btn");
		addMnth.classList.add("btn-lg");
		addMnth.onclick = function () {
			mnthNum -= 1;
			chMnth(monthDiv);
			};
		monthDiv.appendChild(addMnth);
		
		
		addMnth = document.createElement('button');
		addMnth.innerText = mnthB;
		addMnth.classList.add("btn");
		addMnth.classList.add("bg-info");
		addMnth.classList.add("btn-lg");
		monthDiv.appendChild(addMnth);
		
		
		addMnth = document.createElement('button');
		addMnth.innerText = mnthC;
		addMnth.classList.add("btn");
		addMnth.classList.add("btn-lg");
		addMnth.onclick = function () {
			mnthNum += 1;
			chMnth(monthDiv);
			};
		monthDiv.appendChild(addMnth);
		
		//Handle days 
		if (mnthNum == 0) {
			//document.getElementById("dayScrl").innerHTML = '<button class="btn btn-lg" onclick="";>Boop</button><button class="btn btn-lg bg-info">All</button><button class="btn btn-lg" onclick="">All</button>';
			document.getElementById("dayScrl").classList.remove("d-grid");
			document.getElementById("dayScrl").classList.add("d-none");
			
		} else {
			daysInMonth = new Date(1968, mnthNum, 0).getDate();
			if (dayNum > daysInMonth) {dayNum = daysInMonth};
			document.getElementById("dayScrl").classList.add("d-grid");
			document.getElementById("dayScrl").classList.remove("d-none");
			chDay(event);
		};
		changeDate(mnthNum, dayNum);
	}


	function chDay(event) {
		
		
		// console.log(mnthArray[mnthNum] + ': ' + daysInMonth);
		
		dayA = dayNum - 1;
		dayB = dayNum;
		dayC = dayNum + 1;
		 
		if (dayNum > daysInMonth || dayNum == 0)  {
			dayNum = 0
			dayA = daysInMonth;
			dayB = 'All';
			dayC = 1;
			
		} else {
		
			if (dayNum == daysInMonth || dayNum < 0) {
				dayNum = daysInMonth
				dayA = daysInMonth - 1;
				dayB = daysInMonth;
				dayC = 'All';
			
			} else {
			if (dayNum == 1) {
				dayA = 'All';
				dayB = 1;
				dayC = 2;
				};
			};	
		};
		// console.log(dayNum);
		document.getElementById("dayScrl").innerHTML = '';
		
		const dayDiv = document.getElementById('dayScrl');
		addDay = document.createElement('button');
		addDay.innerText = dayA;
		addDay.classList.add("btn");
		addDay.classList.add("btn-lg");
		addDay.onclick = function () {
			dayNum -= 1;
			chDay(dayDiv);
			};
		dayDiv.appendChild(addDay);
		
		
		addDay = document.createElement('button');
		addDay.innerText = dayB;
		addDay.classList.add("btn");
		addDay.classList.add("bg-info");
		addDay.classList.add("btn-lg");
		dayDiv.appendChild(addDay);
		
		
		addDay = document.createElement('button');
		addDay.innerText = dayC;
		addDay.classList.add("btn");
		addDay.classList.add("btn-lg");
		addDay.onclick = function () {
			dayNum += 1;
			chDay(dayDiv);
			};
		dayDiv.appendChild(addDay);
		changeDate(mnthNum, dayNum);
	}




	monthScrl.addEventListener("touchstart", strtMnthTch, false);
	monthScrl.addEventListener("touchmove", mnthTch, false);
	dayScrl.addEventListener("touchstart", strtDayTch, false);
	dayScrl.addEventListener("touchmove", dayTch, false);
	 
	// Swipe Up / Down / Left / Right
	var initMY = null;

	 
	function strtMnthTch(e) {

	  initMY = e.touches[0].clientY;
	}
	 
	function mnthTch(e) {
	  
	 
		if (initMY === null) {
			return;
		}
	 
	  
		var currMY = e.touches[0].clientY;
		var diffY = initMY - currMY;
	 
		if (diffY > 0) {
			mnthNum += 1;
			chMnth(e);
		} else {
			mnthNum -= 1;
			chMnth(e);
		}  
		
	  initMY = null;
	   
	  e.preventDefault();
	}


	function strtDayTch(e) {

	  initDY = e.touches[0].clientY;
	}
	 
	function dayTch(e) {
	  
	 
		if (initDY === null) {
			return;
		}
	 
	  
		var currDY = e.touches[0].clientY;
		var diffY = initDY - currDY;
	 
		if (diffY > 0) {
			dayNum += 1;
			chDay(e);
		} else {
			dayNum -= 1;
			chDay(e);
		}  
		
	  initDY = null;
	   
	  e.preventDefault();
	}

</script>


</html>
