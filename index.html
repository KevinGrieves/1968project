<!DOCTYPE html>
<html lang="en">
<head>
	<title>1968 Project</title>
	<!--Bootstrap-->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
	<!--Leaflet-->
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script> 
	
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="The 1968 Project is an interactive map of the key events of this tumultuous year">
	<meta charset="UTF-8">
<style>
	html, body, #map {
        height: 100%;
        width: 100%;
    }
    
    a {
		text-decoration:none;
	}
	
	a:hover {
		font-style:bold;
		color:#000;
    }
    
    #map {
		background-color: #AAD3DF;
	}
	
	.mainmap {
		z-index:0;
	}
	
	.sidebar {
		top:0;
		position:absolute;
		z-index:100;
		width:0px;
		
	}
	
	.infoBox {
		z-index:200;

	}
	
	.modal-backdrop {
		z-index: 150;
	}
	
	.modal-article {
		display: grid;
		grid-template-columns: auto 1fr;
		gap: 15px;
		
	}
           
	
	.loading-screen {
		background-color: #000020;
		position: fixed;
		top: 0;
		left: 0;
		width: 100%;
		height: 100%;
		z-index: 1000;
		display: flex;
		flex-direction: column;
		justify-content: center;
		align-items: center;
		opacity: 80%;
		transition: all 0.2s; 
	}


	
</style>



</head>

<body>
	<!-- Loading page -->
	<div class="loading-screen">
		<div class="p-2">
			<img src="./images/1968logo.png" width="800" class="img-fluid">
		</div>
		
		
		<div class="spinner-border text-white" role="status">
			
			<span class="visually-hidden">Loading...</span>
		</div>

	
	
	</div>

	<!-- Modal -->
	<div class="infoBox modal fade h-75" id="infoBox" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
	  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
		<div class="modal-content">
		  <div class="modal-header" id="infoBoxHead">
			<h1 class="modal-title fs-5">Modal title</h1>
			<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
		  </div>
		  <div class="modal-body" id="infoBoxBody">
			<h2>Modal</h2>
		  </div>
		  <div class="modal-footer" id="infoBoxFoot">
			<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
			
		  </div>
		</div>
	  </div>
	</div>

	
	
	
	
	<!-- Map -->
	<div id="map" class="mainmap flex-fill"></div>	
	
	
	<!-- Responsive sidebar -->
	<div class="sidebar vh-100">
        
        <nav class="navbar navbar-expand-sm bg-transparent ms-3 p-1" id="topnav">
			 
			<button class="navbar-toggler border border-3 border-dark bg-light" type="button" data-bs-toggle="offcanvas" data-bs-target="#leftnav" aria-controls="leftnav" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
				
            </button>
            
        </nav>
        <div class="container-fluid d-flex m-0 p-0">
			<nav id="leftnav" class="d-flex flex-column flex-shrink-1 offcanvas-md offcanvas-start">
                <div class="offcanvas-header">
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#leftnav" aria-controls="leftnav" aria-label="Close"></button>
                </div>
                <div class="flex-column h-100">
					<div class="bg-white rounded p-2 m-3 overflow-auto" style="--bs-bg-opacity: .8; width:200px;">
						<img src="./images/1968logo.png" width="300" class="img-fluid">  
					</div>
					<div class="bg-white rounded p-2 m-3" style="--bs-bg-opacity: .8;">
						<div class="form-check">
							<label class="form-check-label" for="chkDate">Filter by date</label>
							<input type="checkbox" class="form-check-input" id="chkDate" name="dateFltr" onchange='dateChk(this);'>
							
						</div>
						
						<div id="datePicker" class="collapse">
						
							<ul class="nav nav-pills"  role="tablist">
								<li>
									<a class="nav-link active" data-bs-toggle="tab" href="#monthTab" onclick="clickMonth()">Month</a>
								</li>
								
								<li class="nav-item">
									<a class="nav-link" data-bs-toggle="tab" href="#dayTab" onclick="clickDay()">Day</a>
								</li>
								
							</ul>
						
							<div class="tab-content mt-1">
								<div id="monthTab" class="container tab-pane active p-0">
									<input class="form-control" id="selMonth" type="month" value="1968-01" min="1968-01" max="1968-12" onchange="changeMonth(value);">
								</div>
								<div id="dayTab" class="container tab-pane fade p-0">
									<input class="form-control" id="selDate" type="date" value="1968-01-01" min="1968-01-01" max="1968-12-31" onchange="changeDay(value);">
								</div>
							</div>

						</div>
						
						
						
						
						<br>
						
						
						<div class="dropdown mt-2">
							<button id="topicBtn" class="btn btn-primary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
								Select Topic
							</button>
							<ul class="dropdown-menu">
								
								<li><a class="dropdown-item" href="#" onclick="changeKeyword('all');">All</a></li>
								<li><a class="dropdown-item" href="#" onclick="changeKeyword('Disaster');">Disaster</a></li>
								<li><a class="dropdown-item" href="#" onclick="changeKeyword('Nuclear weapons');">Nuclear weapons</a></li>
								<li><a class="dropdown-item" href="#" onclick="changeKeyword('Prague Spring');">Prague Spring</a></li>
								<li><a class="dropdown-item" href="#" onclick="changeKeyword('Vietnam War');">Vietnam War</a></li>
							
								
							</ul>
						</div>
					</div>
					<div id="eventList" class="bg-white rounded p-2 m-3 overflow-auto" style="--bs-bg-opacity: .8; height: calc(100vh - 400px);">
						<p><b>Events</b></p>
					</div>
				</div>
			</nav>
           
		</div>
	
	</div>
	
	

</body>
<script src="test.json" type="text/javascript"></script>
<script src="CShapes-2.0.geojson" type="text/javascript"></script>


<script>
	const loadingScreen = document.querySelector('.loading-screen');
	window.addEventListener('load', () => {
			loadingScreen.style.opacity = '0';
			setTimeout(() => {
				
				loadingScreen.style.display = 'none';
			}, 200);
		
	});
	
	
	var filterKey = 'all';	
	var fltDay = 0;
	var fltMonth = 0;
	
	var map = L.map('map', {
		worldCopyJump: true,
		center:[40, -10],
		zoomSnap: 0.25,
		zoom: 2.5,
		maxZoom: 19,
		minZoom: 2,
		zoomControl: false
	});
	


	L.control.zoom({
		position: 'bottomright'
	}).addTo(map);

	L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
		noWrap: true
		
	}).addTo(map);
	
	function markerClick(e) {
  		
  		clickedMarker = e.target;
  		eventTitle = clickedMarker.feature.properties.title;
  		eventLoc = clickedMarker.feature.properties.location;
  		eventBlurb = clickedMarker.feature.properties.description;
  		eventDate = clickedMarker.feature.properties.datetxt;
  		eventKeys = clickedMarker.feature.properties.keywords;
  		eventImg = clickedMarker.feature.properties.image;
  		
  		if (clickedMarker.feature.properties.attr == null) {
            eventAttr = ""
        } else {
            eventAttr = '<span style="font-size:50%;">' + clickedMarker.feature.properties.attr + '</span>'
        };
  		
  		let ibHead = document.getElementById('infoBoxHead');
  		ibHead.innerHTML='<h4>' + eventTitle + '</h4>';
  		let ibBody = document.getElementById('infoBoxBody');
  		ibBody.innerHTML='<h5>' + eventDate + '</h5><h5>Location: ' + eventLoc + '</h5><div style="width:200px; line-height:50%; float:right;  margin-left:5px;"><img src="./images/' + eventImg + '" class="img-fluid border">' + eventAttr + '</div><p>' + eventBlurb + '</p>';

  		const kwordLink = document.createElement('a');
		kwordLink.href = "#";
		kwordLink.innerText = eventKeys;
		kwordLink.setAttribute("style", "font-style:italic;");
		kwordLink.onclick = function () {
			filterKey = eventKeys;
			$("#infoBox").modal('hide');
			refreshMap();
		};
		ibBody.appendChild(kwordLink);
  		
  		
  		
  		
  		$("#infoBox").modal('show');
		
		
		

	}
	
	function cntryClick(e) {
  		
  		clickedCntry = e.target;
  		cntryName = clickedCntry.feature.properties.cntry_name;
  		
  		
  		let ibHead = document.getElementById('infoBoxHead');
  		ibHead.innerHTML='<h4>' + cntryName + '</h4>';
  		let ibBody = document.getElementById('infoBoxBody');
  		ibBody.innerHTML='Put something here';
  		$("#infoBox").modal('show');
		
		
		

	}
	
	function onEachFeature(feature, layer) {
		
		// Create DOM nodes with onclick yuk!
		const eventLst = document.getElementById('eventList');
		const newEvent = document.createElement('a');
		
		newEvent.href = "#";
		newEvent.innerText = feature.properties.title;
		newEvent.setAttribute("style", "display:block; padding-bottom:6px;");
		newEvent.setAttribute("data-bs-dismiss", "offcanvas");
		newEvent.setAttribute("data-bs-target", "#leftnav");
		
		newEvent.onclick = function () {
				eventTitle = feature.properties.title;
				eventLoc = feature.properties.location;
				eventBlurb = feature.properties.description;
				eventDate = feature.properties.datetxt;
				eventKeys = feature.properties.keywords;
				eventImg = feature.properties.image;
				
				if (feature.properties.attr == null) {
					eventAttr = ""
				} else {
					eventAttr = '<span style="font-size:50%;">' + feature.properties.attr + '</span>'
				};
				let ibHead = document.getElementById('infoBoxHead');
				ibHead.innerHTML='<h4>' + eventTitle + '</h4>';
				let ibBody = document.getElementById('infoBoxBody');
				ibBody.innerHTML='<h5>' + eventDate + '</h5><h5>Location: ' + eventLoc + '</h5><div style="width:200px; line-height:50%; float:right; margin-left:5px;"><img src="./images/' + eventImg + '" class="img-fluid border">' + eventAttr + '</div><p>' + eventBlurb + '</p>';
				
				
				const kwordLink = document.createElement('a');
				kwordLink.href = "#";
				kwordLink.innerText = eventKeys;
				kwordLink.setAttribute("style", "");
				kwordLink.onclick = function () {
					filterKey = eventKeys;
					$("#infoBox").modal('hide');
					refreshMap();
				};
				
				
				ibBody.appendChild(kwordLink);
				
				
				var coOrds = layer.getLatLng();
				map.flyTo([(coOrds.lat + 10), coOrds.lng], 5);
				$("#infoBox").modal('show');
				
			};
		
		eventLst.appendChild(newEvent);
		

		

		layer.on({
			click: markerClick
		});
		
	}

	function onEachCountry(feature, layer) {
		layer.on({
			click: cntryClick
		});
		
	}

	var cntryLayer = new L.geoJSON(countries68, {
		onEachFeature: onEachCountry
	}).addTo(map);
	
	cntryLayer.setStyle({
		color: "#ff4000", 
		weight: 1, 
		opacity: 0.3
	});
	
	
	
	function applyFilter(feature) {
		
		if (chkDate.checked === true) {
			if (fltDay > 0) {
				if (feature.properties.day !== fltDay) {
					return false;
				}
			}
			if (fltMonth > 0) {
				if (feature.properties.month !== fltMonth) {
					return false;
				}
			}
		}
		
		if (filterKey !== 'all') {
			if (feature.properties.keywords !== filterKey) return false;
		}
		
		return true;
			
		

	}

	function refreshMap() {
		let newEventList = document.getElementById('eventList');
		newEventList.innerHTML='<p><b>Events</b></p>';
		
		
		markerLayer.clearLayers();
		markerLayer = L.geoJSON(testdb, {
			filter: applyFilter,
			onEachFeature: onEachFeature
		}).addTo(map);
		map.flyTo([40, -10], 2.5)
		
	}
	
	
	var markerLayer = new L.geoJSON(testdb, {
		
		onEachFeature: onEachFeature
	}).addTo(map);

	function changeDay(date) {
		var spltDate = date.split('-');
		fltMonth = spltDate[1];
		fltDay = spltDate[2];
		selMonth.value = "1968-" + spltDate[1];
		refreshMap();
		<!-- Change Month to match -->
	}
	
	function changeMonth(date) {
		var spltDate = date.split('-');
		fltMonth = spltDate[1];
		fltDay = 0;
		refreshMap();
	}
	
	function clickMonth() {
		fltDay = 0;
		refreshMap();
	}
	
	function clickDay() {
		var spltDate = selDate.value.split('-');
		fltDay = spltDate[2];
		
		refreshMap();

	}
	
	function dateChk(checkbox) {
		if(checkbox.checked == true){
			document.getElementById('datePicker').classList.remove('collapse');
		}else{
			document.getElementById('datePicker').classList.add('collapse');
			<!-- Reset dates ? -->
	   };
	   refreshMap();
	   
	}

	function changeKeyword(keyword) {
		filterKey = keyword;
		if (keyword === 'all') {
			topicBtn.innerHTML = 'Select Topic';
		} else  topicBtn.innerHTML = keyword;
		refreshMap();
		
	}

</script>


</html>
